<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выплаты</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%82%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <h1>Выплаты</h1>
  <div class="today" id="todayLabel"></div>
</header>

<main>

  <!-- 1. Быстрый ввод за день -->
  <section class="card">
    <h2>Быстрый ввод за день</h2>

    <div class="field">
      <label for="qDate">Дата</label>
      <input type="date" id="qDate">
    </div>

    <div class="qlist" id="qList"></div>
    <button type="button" class="more" id="qMore" hidden></button>

    <div class="qbar">
      <button type="button" id="qSave" disabled>Записать</button>
      <span class="qsum" id="qSum">Впиши суммы тем, кто работал</span>
    </div>
  </section>

  <!-- 2. Добавить выплату -->
  <section class="card">
    <h2>Добавить выплату</h2>

    <form id="payForm" autocomplete="off">
      <div class="field">
        <label for="name">Работник</label>
        <input type="text" id="name" list="names" placeholder="Имя" maxlength="40" required>
        <datalist id="names"></datalist>
      </div>

      <div class="pair">
        <div class="field">
          <label for="amount">Сумма, ₸</label>
          <input type="number" id="amount" inputmode="numeric" min="1" max="100000000" step="1" placeholder="10000" required>
        </div>
        <div class="field">
          <label for="date">Дата</label>
          <input type="date" id="date" required>
        </div>
      </div>

      <div class="field">
        <label for="note">Комментарий</label>
        <input type="text" id="note" placeholder="Что делал — необязательно" maxlength="120">
      </div>

      <div class="submit-row">
        <button type="submit">Записать</button>
        <span class="saved" id="saved" hidden>Записано</span>
      </div>
    </form>
    <div class="hint">Здесь же добавляется новый работник — после первой выплаты он появится в быстром вводе.</div>
  </section>

  <!-- 3. Итоги по месяцам -->
  <section class="card">
    <h2>Итоги по месяцам</h2>

    <div class="month-nav">
      <button type="button" id="prevMonth" aria-label="Предыдущий месяц">‹</button>
      <input type="month" id="month" aria-label="Месяц">
      <button type="button" id="nextMonth" aria-label="Следующий месяц">›</button>
    </div>

    <div class="totals" id="totals"></div>
    <div class="grand" id="grand"></div>

    <h3>Записи за месяц</h3>
    <div class="filterbar" id="filterBar" hidden></div>
    <div class="entries" id="entries"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
